name: Build Release APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Robolectric needs a Java 21 runtime to emulate SDK 36
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      # recordRoborazziDebug runs the full unit-test suite with Roborazzi
      # recording enabled, so screen captures are actually written to
      # app/src/test/screenshots/ (plain testDebugUnitTest no-ops them).
      - name: Run unit tests (with Roborazzi recording)
        run: gradle :app:recordRoborazziDebug --no-daemon --stacktrace

      # Roborazzi writes screen captures during the test run — publish them
      # so UI changes can be reviewed visually from the workflow run page.
      - name: Upload UI screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/src/test/screenshots/
          if-no-files-found: warn

      # Screenshots are tracked in git — push the regenerated set back to the
      # feature branch so they are reviewable in the PR diff. [skip ci] keeps
      # the screenshot timestamps from re-triggering this workflow forever.
      - name: Commit refreshed screenshots back to the branch
        if: github.event_name == 'push' && github.ref_name != 'main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "ci: refresh UI screenshots [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
          fi

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode keystores
        run: |
          base64 -d release.keystore.base64 > release.keystore
          base64 -d debug.keystore.base64 > debug.keystore

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: android123
          KEY_PASSWORD: android123
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Copy APK to build-outputs
        run: |
          mkdir -p .build-outputs
          cp app/build/outputs/apk/release/*.apk .build-outputs/app-release.apk
          echo "Release APK saved to .build-outputs/app-release.apk"
