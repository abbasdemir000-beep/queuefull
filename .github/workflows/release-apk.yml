name: Build Release APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  # Typecheck + compile the Cloud Functions so backend/ can never rot.
  backend-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci
        working-directory: backend/functions

      - name: Build functions (tsc, strict)
        run: npm run build
        working-directory: backend/functions

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Robolectric needs a Java 21 runtime to emulate SDK 36
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      # recordRoborazziDebug runs the full unit-test suite with Roborazzi
      # recording enabled, so screen captures are actually written to
      # app/src/test/screenshots/ (plain testDebugUnitTest no-ops them).
      - name: Run unit tests (with Roborazzi recording)
        run: gradle :app:recordRoborazziDebug --no-daemon --stacktrace

      # Lint is configured with abortOnError=false for now; the report is
      # published as an artifact so regressions are reviewable per-run.
      - name: Run Android Lint
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Upload lint report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      # Roborazzi writes screen captures during the test run — publish them
      # so UI changes can be reviewed visually from the workflow run page.
      - name: Upload UI screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/src/test/screenshots/
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    env:
      # Monotonic version code so every CI release build is Play-uploadable.
      VERSION_CODE: ${{ github.run_number }}
      # Signing prefers real GitHub secrets; falls back to the committed
      # placeholder keystore (password android123) for sideload testing only.
      # (secrets.* is hoisted into env here because the secrets context is not
      # available inside step-level `if:` expressions.)
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'android123' }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android123' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode keystores
        run: |
          base64 -d release.keystore.base64 > release.keystore
          base64 -d debug.keystore.base64 > debug.keystore

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # base64 -i tolerates the CR/LF and whitespace that copy-pasting into the
      # GitHub secrets UI tends to introduce. An undecodable secret falls back
      # to the committed placeholder keystore (and its matching passwords) so
      # CI keeps verifying the release build — with a loud warning, because
      # placeholder-signed artifacts must never go to Play.
      - name: Use production keystore when secrets are configured
        if: ${{ env.RELEASE_KEYSTORE_B64 != '' }}
        run: |
          if printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d -i > release.keystore.prod 2>/dev/null && [ -s release.keystore.prod ]; then
            mv release.keystore.prod release.keystore
            echo "Production keystore installed ($(wc -c < release.keystore) bytes)."
          else
            rm -f release.keystore.prod
            echo "::warning::RELEASE_KEYSTORE_B64 is not valid base64 — signing with the committed PLACEHOLDER keystore instead (not Play-uploadable). Re-create the secret with: base64 -w0 your-keystore.jks"
            echo "STORE_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android123" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build release AAB (Play upload format)
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Copy APK to build-outputs
        run: |
          mkdir -p .build-outputs
          cp app/build/outputs/apk/release/*.apk .build-outputs/app-release.apk
          echo "Release APK saved to .build-outputs/app-release.apk"
